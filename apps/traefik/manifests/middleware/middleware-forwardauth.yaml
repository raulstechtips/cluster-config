---
# OAuth2 Proxy Authentication Verification Middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth-verify
  namespace: default
spec:
  forwardAuth:
    address: "http://oauth2-proxy.oauth2-proxy.svc.cluster.local/oauth2/auth"
    trustForwardHeader: true
---
# OAuth2 Proxy Sign-In Redirect Middleware
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth-signin
  namespace: default
spec:
  errors:
    status:
      - "401-403"
    service:
      name: oauth2-proxy
      namespace: oauth2-proxy
      port: 80
    query: "/oauth2/sign_in?rd={url}"
---
# OAuth2 Proxy Chain Middleware (combines verify + signin)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: oauth-chain
  namespace: default
spec:
  chain:
    middlewares:
      - name: oauth-signin
        namespace: default
      - name: oauth-verify
        namespace: default
