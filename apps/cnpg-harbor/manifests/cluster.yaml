---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-harbor
  namespace: harbor
  labels:
    cnpg.io/reload: ""
spec:
  description: "Harbor PostgreSQL Cluster"
  instances: 3
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: true
  postgresql:
    parameters:
      max_wal_size: "16GB"
      max_slot_wal_keep_size: "16GB"
  bootstrap:
    initdb:
      database: registry
      owner: pg-harbor-admin
      secret:
        name: pg-harbor-admin-credentials-secret
  backup:
    retentionPolicy: '7d'
    volumeSnapshot:
      className: longhorn-volume-snapshot-class
      walClassName: longhorn-volume-snapshot-class
      snapshotOwnerReference: none
  storage:
    storageClass: longhorn-storage-class-local
    size: 20Gi
  walStorage:
    storageClass: longhorn-storage-class-local
    size: 20Gi
