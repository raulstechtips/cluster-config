---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: infisical-secret-infisical-gateway-environment
  namespace: infisical-gateway
spec:
  hostAPI: "${ARGOCD_ENV_INFISICAL_PROD_HOST_API}"
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
      secretsScope:
        projectSlug: "${ARGOCD_ENV_INFISICAL_PROJECT_SLUG}"
        envSlug: "${ARGOCD_ENV_INFISICAL_ENV_SLUG}"
        secretsPath: "/infisical/gateway"
        recursive: true
  managedKubeSecretReferences:
    - secretName: infisical-gateway-enrollment-token
      secretNamespace: infisical-gateway
      secretType: Opaque
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          enrollment-token: "{{ .GATEWAY_ENROLLMENT_TOKEN.Value }}"
