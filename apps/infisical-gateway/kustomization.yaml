---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infisical-gateway

helmCharts:
  - name: infisical-gateway
    repo: https://dl.cloudsmith.io/public/infisical/helm-charts/helm/charts/
    version: 1.2.0
    releaseName: infisical-gateway
    namespace: infisical-gateway
    valuesFile: values/prod.yaml

resources:
  - manifests/secrets/infisical-gateway-environment.yaml
