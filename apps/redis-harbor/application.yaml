---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: redis-harbor
  namespace: harbor
spec:
  project: default
  source:
    repoURL: https://github.com/raulstechtips/cluster-config.git
    targetRevision: HEAD
    path: apps/redis-harbor
    plugin:
      name: kustomize-envsubst
  destination:
    server: https://kubernetes.default.svc
    namespace: harbor
  syncPolicy: {}
  revisionHistoryLimit: 10
