---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: pg-serenemind
  namespace: serenemind
  labels:
    cnpg.io/reload: ""
  annotations:
    secrets.infisical.com/auto-reload: "true"
spec:
  description: "Serenemind PostgreSQL Cluster"
  instances: 3
  primaryUpdateStrategy: unsupervised
  enableSuperuserAccess: true
  postgresql:
    parameters:
      max_wal_size: "6GB"
      max_slot_wal_keep_size: "6GB"
  certificates:
    serverCASecret: raulstechtips-internal-ca-key-pair
    serverTLSSecret: pg-serenemind-internal-tls
  bootstrap:
    initdb:
      database: pg-serenemind
      owner: pg-serenemind-admin
      secret:
        name: pg-serenemind-admin-credentials-secret
  backup:
    retentionPolicy: '7d'
    volumeSnapshot:
      className: longhorn-volume-snapshot-class
      walClassName: longhorn-volume-snapshot-class
      snapshotOwnerReference: none
  storage:
    storageClass: longhorn-storage-class-local
    size: 10Gi
  walStorage:
    storageClass: longhorn-storage-class-local
    size: 10Gi
