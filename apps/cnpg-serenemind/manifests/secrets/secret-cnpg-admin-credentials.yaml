---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: infisical-secret-pg-serenemind-admin-credentials-secret
  namespace: serenemind
  labels:
    cnpg.io/reload: "true"
spec:
  hostAPI: "${ARGOCD_ENV_INFISICAL_PROD_HOST_API}"
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
      secretsScope:
        projectSlug: "${ARGOCD_ENV_INFISICAL_PROJECT_SLUG}"
        envSlug: staging
        secretsPath: "/serenemind/postgres"
        recursive: true
  managedKubeSecretReferences:
    - secretName: pg-serenemind-admin-credentials-secret
      secretNamespace: serenemind
      secretType: kubernetes.io/basic-auth
      creationPolicy: Owner
      template:
        includeAllSecrets: true
        data:
          username: "{{ .username.Value }}"
          password: "{{ .password.Value }}"
