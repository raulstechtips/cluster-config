---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: oauth2-proxy-ingress-prod
  namespace: oauth2-proxy
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: (Host(`${ARGOCD_ENV_OAUTH2_PROXY_PROD_DOMAIN}`) && PathPrefix(`/oauth2/`)) || PathPrefix(`/oauth2/`)
      kind: Rule
      middlewares:
        - name: default-headers
          namespace: default
        - name: strict-referrer
          namespace: default
      services:
        - name: oauth2-proxy
          port: 80
  tls:
    secretName: prod-raulstechtips-tls
