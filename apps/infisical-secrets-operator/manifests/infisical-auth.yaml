---
apiVersion: secrets.infisical.com/v1beta1
kind: InfisicalAuth
metadata:
  name: infisical-prod-universal-auth
  namespace: default
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  method: universal
  infisicalConnectionRef:
    name: infisical-prod
    namespace: default
  universal:
    clientIdRef:
      name: universal-auth-credentials
      namespace: infisical
      key: clientId
    clientSecretRef:
      name: universal-auth-credentials
      namespace: infisical
      key: clientSecret
