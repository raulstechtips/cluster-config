---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: infisical-secret-pg-coder-database-credentials
  namespace: prod
  labels:
    cnpg.io/reload: "true"
spec:
  hostAPI: "${ARGOCD_ENV_INFISICAL_PROD_HOST_API}"
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
      secretsScope:
        projectSlug: "${ARGOCD_ENV_INFISICAL_PROJECT_SLUG}"
        envSlug: "staging"
        secretsPath: "/cnpg/staging/users/coder"
        recursive: true
  managedKubeSecretReferences:
    - secretName: pg-coder-database-credentials-secret
      secretNamespace: prod
      secretType: kubernetes.io/basic-auth
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          username: "{{ .PG_CODER_USER.Value }}"
          password: "{{ .PG_CODER_PASSWORD.Value }}"
