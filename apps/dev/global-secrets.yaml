# Shared registry credentials are fetched by the Infisical operator.
# Only source paths and key names belong in Git.
infisical:
  authRef:
    name: infisical-prod-universal-auth
    namespace: default
  projectSlug: k3s-ntpo
  environmentSlug: prod
  refreshInterval: 60s
secrets:
  - name: github-registry-secret
    secretPath: /registry
    type: kubernetes.io/dockerconfigjson
    keys:
      .dockerconfigjson: DOCKER_CONFIG_JSON
    reflection:
      enabled: true
  - name: harbor-registry-secret
    secretPath: /registry/harbor
    type: kubernetes.io/dockerconfigjson
    keys:
      .dockerconfigjson: DOCKER_CONFIG_JSON
    reflection:
      enabled: true
