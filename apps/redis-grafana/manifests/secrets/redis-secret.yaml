---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: infisical-secret-grafana-redis-secret
  namespace: monitoring
spec:
  hostAPI: "${ARGOCD_ENV_INFISICAL_PROD_HOST_API}"
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
      secretsScope:
        projectSlug: "${ARGOCD_ENV_INFISICAL_PROJECT_SLUG}"
        envSlug: "${ARGOCD_ENV_INFISICAL_ENV_SLUG}"
        secretsPath: "/prometheus/grafana/app"
        recursive: true
  managedKubeSecretReferences:
    - secretName: grafana-redis-secret
      secretNamespace: monitoring
      secretType: Opaque
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          REDIS_PASSWORD: "{{ .GRAFANA_REDIS_PASSWORD.Value }}"
