---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

helmCharts:
  - name: redis
    repo: oci://${ARGOCD_ENV_CONTAINER_REGISTRY_DOMAIN}/raulstechtips
    version: 22.0.5
    releaseName: redis-grafana
    namespace: monitoring
    valuesFile: values/prod.yaml

resources:
  - manifests/secrets/redis-secret.yaml
