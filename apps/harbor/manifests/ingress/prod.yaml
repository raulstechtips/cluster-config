---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: harbor-ingress-prod
  namespace: harbor
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`${ARGOCD_ENV_CONTAINER_REGISTRY_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: strict-referrer
          namespace: default
        - name: default-headers
          namespace: default
      services:
        - name: harbor
          port: 80
  tls:
    secretName: prod-raulstechtips-tls
