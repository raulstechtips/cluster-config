---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/raulstechtips/cluster-config.git
    targetRevision: HEAD
    path: apps/cnpg-dev
    plugin:
      name: kustomize-envsubst
  destination:
    server: https://kubernetes.default.svc
    namespace: dev
  syncPolicy: {}
  revisionHistoryLimit: 10
