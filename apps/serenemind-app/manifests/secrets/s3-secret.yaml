---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: infisical-secret-serenemind-s3-secret
  namespace: serenemind
  labels:
    cnpg.io/reload: "true"
spec:
  hostAPI: "${ARGOCD_ENV_INFISICAL_PROD_HOST_API}"
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
      secretsScope:
        projectSlug: "${ARGOCD_ENV_INFISICAL_PROJECT_SLUG}"
        envSlug: prod
        secretsPath: "/minio/users/longhorn"
        recursive: true
  managedKubeSecretReferences:
    - secretName: s3-secret
      secretNamespace: serenemind
      secretType: Opaque
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          # ONLY STAGING SECRETS
          AWS_ACCESS_KEY_ID: "{{ .AWS_ACCESS_KEY_ID.Value }}"
          AWS_SECRET_ACCESS_KEY: "{{ .AWS_SECRET_ACCESS_KEY.Value }}"
