---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: keycloak

helmCharts:
  - name: keycloak
    repo: oci://${ARGOCD_ENV_CONTAINER_REGISTRY_DOMAIN}/raulstechtips
    version: 25.2.0
    releaseName: keycloak
    namespace: keycloak
    valuesFile: values/prod.yaml

resources:
  - manifests/secrets/prod-tls-secret.yaml
  - manifests/secrets/live-tls-secret.yaml
  - manifests/secrets/keycloak-admin-credentials-secret.yaml
  - manifests/ingress/live.yaml
  - manifests/ingress/prod.yaml
  - manifests/secrets/push/live-tls-infisical-push-secret.yaml
  - manifests/secrets/push/prod-tls-infisical-push-secret.yaml
