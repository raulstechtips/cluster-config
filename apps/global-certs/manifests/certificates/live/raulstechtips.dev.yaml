---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: live-raulstechtips
  namespace: default
spec:
  secretName: live-raulstechtips-tls
  issuerRef:
    name: letsencrypt-production
    kind: ClusterIssuer
  commonName: "*.${ARGOCD_ENV_DOMAIN}"
  dnsNames:
    - "${ARGOCD_ENV_DOMAIN}"
    - "*.${ARGOCD_ENV_DOMAIN}"
  secretTemplate:
    annotations:
      reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
      reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "jenkins,minio"
      reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
