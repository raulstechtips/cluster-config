---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: huginn
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/raulstechtips/cluster-config.git
    targetRevision: HEAD
    path: apps/huginn
  destination:
    server: https://kubernetes.default.svc
    namespace: huginn
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
