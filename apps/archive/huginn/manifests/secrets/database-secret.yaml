---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: infisical-secret-huginn-database
  namespace: huginn
spec:
  hostAPI: "https://infisical.prod.raulstechtips.dev/api"
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
      secretsScope:
        projectSlug: "k3s-ntpo"
        envSlug: "prod"
        secretsPath: "/huginn/postgres"
        recursive: true
  managedKubeSecretReferences:
    - secretName: huginn-database-secret
      secretNamespace: huginn
      secretType: Opaque
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          POSTGRES_DB: "{{ .POSTGRES_DB.Value }}"
          POSTGRES_USER: "{{ .POSTGRES_USER.Value }}"
          POSTGRES_PASSWORD: "{{ .POSTGRES_PASSWORD.Value }}"
