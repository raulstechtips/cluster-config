---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: infisical-secret-huginn-app
  namespace: huginn
spec:
  hostAPI: "https://infisical.prod.raulstechtips.dev/api"
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
      secretsScope:
        projectSlug: "k3s-ntpo"
        envSlug: "prod"
        secretsPath: "/huginn/app"
        recursive: true
  managedKubeSecretReferences:
    - secretName: huginn-app-secret
      secretNamespace: huginn
      secretType: Opaque
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          SECRET_KEY_BASE: "{{ .SECRET_KEY_BASE.Value }}"
          APP_SECRET_TOKEN: "{{ .APP_SECRET_TOKEN.Value }}"
          SEED_USERNAME: "{{ .SEED_USERNAME.Value }}"
          SEED_PASSWORD: "{{ .SEED_PASSWORD.Value }}"
          INVITATION_CODE: "{{ .INVITATION_CODE.Value }}"
          DOMAIN: "{{ .DOMAIN.Value }}"
