---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: infisical-secret-huginn-smtp
  namespace: huginn
spec:
  hostAPI: "https://infisical.prod.raulstechtips.dev/api"
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
      secretsScope:
        projectSlug: "k3s-ntpo"
        envSlug: "staging"
        secretsPath: "/serenemind/smtp"
        recursive: true
  managedKubeSecretReferences:
    - secretName: huginn-smtp-secret
      secretNamespace: huginn
      secretType: Opaque
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          SMTP_USER_NAME: "{{ .EMAIL_HOST_USER.Value }}"
          SMTP_PASSWORD: "{{ .EMAIL_HOST_PASSWORD.Value }}"
          SMTP_SERVER: "{{ .EMAIL_HOST.Value }}"
          SMTP_PORT: "{{ .EMAIL_PORT.Value }}"
          EMAIL_FROM_ADDRESS: "{{ .DEFAULT_FROM_EMAIL.Value }}"
