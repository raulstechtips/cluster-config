---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: rabbitmq-prod-ingress-prod
  namespace: prod
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`mq.prod.raulstechtips.dev`)
      kind: Rule
      middlewares:
        - name: default-headers
          namespace: default
        # - name: strict-referrer
        #   namespace: default
      services:
        - name: rabbitmq-prod
          port: 15672
  tls:
    secretName: prod-raulstechtips-tls
