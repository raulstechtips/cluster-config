---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: rabbitmq-prod-internal-certificate
  namespace: prod
spec:
  secretName: rabbitmq-prod-internal-tls
  duration: 8760h # 1 year
  renewBefore: 720h # 30 days
  subject:
    organizations:
      - raulstechtips
  dnsNames:
    - '*.rabbitmq-prod-nodes.prod.svc.cluster.local'
    - rabbitmq-prod.prod.svc.cluster.local
  issuerRef:
    name: raulstechtips-internal-ca-issuer
    kind: ClusterIssuer
