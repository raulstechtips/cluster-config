---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: grafana-ingress-prod
  namespace: monitoring
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`${ARGOCD_ENV_GRAFANA_PROD_DOMAIN}`)
      kind: Rule
      middlewares:
        - name: strict-referrer
          namespace: default
        - name: default-headers
          namespace: default
      services:
        - name: monitoring-grafana
          port: 80
  tls:
    secretName: prod-raulstechtips-tls
