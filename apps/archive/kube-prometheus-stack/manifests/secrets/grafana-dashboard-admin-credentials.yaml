---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: infisical-secret-grafana-dashboard-admin-credentials
  namespace: monitoring
spec:
  hostAPI: "${ARGOCD_ENV_INFISICAL_PROD_HOST_API}"
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
      secretsScope:
        projectSlug: "${ARGOCD_ENV_INFISICAL_PROJECT_SLUG}"
        envSlug: "${ARGOCD_ENV_INFISICAL_ENV_SLUG}"
        secretsPath: "/prometheus/grafana/admin"
        recursive: true
  managedKubeSecretReferences:
    - secretName: grafana-dashboard-admin-credentials
      secretNamespace: monitoring
      secretType: Opaque
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          GRAFANA_DASHBOARD_ADMIN_USER: "{{ .GRAFANA_DASHBOARD_ADMIN_USER.Value }}"
          GRAFANA_DASHBOARD_ADMIN_PASSWORD: "{{ .GRAFANA_DASHBOARD_ADMIN_PASSWORD.Value }}"
