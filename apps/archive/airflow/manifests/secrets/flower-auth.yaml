---
apiVersion: secrets.infisical.com/v1alpha1
kind: InfisicalSecret
metadata:
  name: infisical-secret-airflow-flower-auth
  namespace: airflow
spec:
  hostAPI: ""
  authentication:
    universalAuth:
      credentialsRef:
        secretName: universal-auth-credentials
        secretNamespace: infisical
      secretsScope:
        projectSlug: ""
        envSlug: prod
        secretsPath: "/airflow/app"
        recursive: true
  managedKubeSecretReferences:
    - secretName: airflow-flower-auth
      secretNamespace: airflow
      secretType: Opaque
      creationPolicy: Owner
      template:
        includeAllSecrets: false
        data:
          username: "admin"
          password: "{{ .AIRFLOW_ADMIN_PASSWORD.Value }}"
          basicAuth: "admin:{{ .AIRFLOW_ADMIN_PASSWORD.Value }}"
