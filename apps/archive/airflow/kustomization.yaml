---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: airflow

helmCharts:
  - name: airflow
    repo: https://airflow.apache.org
    version: 1.18.0
    releaseName: airflow
    namespace: airflow
    valuesFile: values/prod.yaml

resources:
  - manifests/secrets/app-secrets.yaml
  - manifests/requirements-configmap.yaml
