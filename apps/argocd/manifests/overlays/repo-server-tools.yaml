---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: argocd-repo-server
spec:
  template:
    spec:
      containers:
        - name: argocd-repo-server
          resources:
            requests:
              cpu: 10m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 1Gi
          envFrom:
            - secretRef:
                name: argocd-app-env
            - secretRef:
                name: argocd-harbor-secrets
          env:
            - name: ARGOCD_CMP_SERVER
              value: "1"
