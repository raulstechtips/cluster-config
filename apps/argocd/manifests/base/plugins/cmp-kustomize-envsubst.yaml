---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cmp-kustomize-envsubst
  namespace: argocd
data:
  plugin.yaml: |
    apiVersion: argoproj.io/v1alpha1
    kind: ConfigManagementPlugin
    metadata:
      name: kustomize-envsubst
    spec:
      generate:
        command: ["bash", "-c"]
        args:
          - |
            set -eo pipefail
            SHELL_FORMAT=$(printf '${%s} ' ${!ARGOCD_ENV_*})
            if [ -f kustomization.tpl.yaml ]; then
              envsubst "$SHELL_FORMAT" < kustomization.tpl.yaml > kustomization.yaml
            fi
            kustomize build --enable-helm --load-restrictor LoadRestrictionsNone . | envsubst "$SHELL_FORMAT"
      discover:
        fileName: kustomization.tpl.yaml
