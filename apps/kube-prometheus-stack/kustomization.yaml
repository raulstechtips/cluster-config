---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring

helmCharts:
  - name: kube-prometheus-stack
    repo: https://prometheus-community.github.io/helm-charts
    version: 79.5.0
    releaseName: monitoring
    namespace: monitoring
    valuesFile: values/prod.yaml

resources:
  - manifests/ingress/alertmanager/prod.yaml
  - manifests/ingress/grafana/prod.yaml
  - manifests/ingress/prometheus/prod.yaml
  - manifests/secrets/grafana-app-secrets.yaml
  - manifests/secrets/grafana-dashboard-admin-credentials.yaml
  - manifests/secrets/thanos-storage-config.yaml
