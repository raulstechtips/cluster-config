# CNPG cluster pg-prod from the cnpg-cluster chart in GHCR.
# Manual sync keeps database restarts deliberate; values come from apps/dev/cnpg-prod.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: cnpg-prod
  namespace: argocd
  annotations:
    # root-dev must never delete this Application.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  project: platform
  sources:
    - repoURL: ghcr.io/raulstechtips/charts
      chart: cnpg-cluster
      targetRevision: 1.0.1-feature-devsecops-59-e3d651a-40fe50d-4
      helm:
        # The release name is the CNPG Cluster name.
        releaseName: pg-prod
        valueFiles:
          - $values/apps/dev/cnpg-prod.yaml
    - repoURL: https://github.com/raulstechtips/cluster-config.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: prod
  revisionHistoryLimit: 10
