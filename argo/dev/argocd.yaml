# Argo CD itself. Same name as the live Application, so root-dev adopts it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  annotations:
    # root-dev must never delete this Application.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  project: default
  sources:
    - repoURL: ghcr.io/raulstechtips/charts
      chart: argocd
      targetRevision: 1.0.0-feature-devsecops-64-6dc91c1-3
      helm:
        releaseName: argocd
        valueFiles:
          - $values/apps/dev/argocd.yaml
    - repoURL: https://github.com/raulstechtips/cluster-config.git
      targetRevision: feature/DEVSECOPS-64-cluster-config-bootstrap-root-and-Argo-CD-switch
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  revisionHistoryLimit: 10
  # Manual sync only. No prune: old Kustomize objects stay until cleanup.
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
