# Shared registry Secrets from GHCR, with values from apps/dev/global-secrets.yaml.
# Publish release 0.1.0 and migrate the legacy InfisicalSecret before the first sync.
# Manual sync prevents an automatic ownership change.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: global-secrets
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  project: platform
  sources:
    - repoURL: ghcr.io/raulstechtips/charts
      chart: global-secrets
      targetRevision: 0.1.0
      helm:
        releaseName: global-secrets
        valueFiles:
          - $values/apps/dev/global-secrets.yaml
    - repoURL: https://github.com/raulstechtips/cluster-config.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy: {}
  revisionHistoryLimit: 10
