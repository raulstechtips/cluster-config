# Actions Runner Controller from the gha-runners-controller wrapper chart in GHCR.
# Manual sync keeps adoption deliberate; values come from apps/dev/gha-runners-controller.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gha-runners-controller
  namespace: argocd
  annotations:
    # root-dev must never delete this Application.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  project: platform
  sources:
    - repoURL: ghcr.io/raulstechtips/charts
      chart: gha-runners-controller
      # Set to the first CI build (1.0.1-main-<sha>-<run>) after the chart repo is merged.
      targetRevision: 1.0.1-feature-devsecops-47-818396f-47ae838-1
      helm:
        releaseName: gha-runners-controller
        # Keep the four CRDs already tracked by this Application.
        skipCrds: false
        valueFiles:
          - $values/apps/dev/gha-runners-controller.yaml
    - repoURL: https://github.com/raulstechtips/cluster-config.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: arc-systems
  revisionHistoryLimit: 10
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
