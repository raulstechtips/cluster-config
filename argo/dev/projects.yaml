# AppProject for platform apps (Argo CD, Jenkins, and other "Move X" stories).
# Sync wave -1: root-dev creates the project before the Applications that use it.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  description: Platform apps managed by root-dev
  sourceRepos:
    - https://github.com/raulstechtips/cluster-config.git
    - ghcr.io/raulstechtips/charts
    - harbor.prod.raulstechtips.dev/raulstechtips/charts
  destinations:
    - server: https://kubernetes.default.svc
      namespace: '*'
  clusterResourceWhitelist:
    - group: '*'
      kind: '*'
