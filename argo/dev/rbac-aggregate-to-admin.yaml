# CNPG and Traefik custom resources for the built-in "admin" ClusterRole.
# The jenkins-deployer RoleBindings (apps/dev/jenkins.yaml deployNamespaces) use "admin";
# without these rules a Helm install of a chart with a CNPG Cluster or an IngressRoute is denied.
# cert-manager and the Infisical operator ship the same kind of aggregated role.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: cnpg-aggregate-to-admin
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups:
      - postgresql.cnpg.io
    resources:
      - "*"
    verbs:
      - "*"
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: traefik-aggregate-to-admin
  labels:
    rbac.authorization.k8s.io/aggregate-to-admin: "true"
rules:
  - apiGroups:
      - traefik.io
    resources:
      - "*"
    verbs:
      - "*"
