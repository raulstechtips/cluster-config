# Keycloak from the keycloak wrapper chart in Harbor.
# Manual sync keeps restarts deliberate; values come from apps/dev/keycloak.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keycloak
  namespace: argocd
  annotations:
    # root-dev must never delete this Application.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  project: platform
  sources:
    - repoURL: harbor.prod.raulstechtips.dev/raulstechtips/charts
      chart: keycloak
      targetRevision: 1.0.1-main-0c1f6b9-1
      helm:
        releaseName: keycloak
        valueFiles:
          - $values/apps/dev/keycloak.yaml
    - repoURL: https://github.com/raulstechtips/cluster-config.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: keycloak
  revisionHistoryLimit: 10
  # Kept from the old Application: changes to the pod template annotations are not drift.
  ignoreDifferences:
    - group: apps
      kind: StatefulSet
      name: keycloak
      namespace: keycloak
      jsonPointers:
        - /spec/template/metadata/annotations
  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true
