# reflector from the upstream emberstack chart (no wrapper chart).
# Values come from apps/dev/reflector.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: reflector
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  project: platform
  sources:
    - repoURL: https://emberstack.github.io/helm-charts
      chart: reflector
      targetRevision: 9.0.322
      helm:
        releaseName: reflector
        valueFiles:
          - $values/apps/dev/reflector.yaml
    - repoURL: https://github.com/raulstechtips/cluster-config.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
  revisionHistoryLimit: 10
