# Shared certificates and internal CA export from GHCR.
# Manual sync keeps adoption deliberate; values come from apps/dev/global-certs.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: global-certs
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  project: platform
  sources:
    - repoURL: ghcr.io/raulstechtips/charts
      chart: global-certs
      # Set to the first CI build (1.0.1-main-<sha>-<run>) after the chart repo is merged.
      targetRevision: 1.0.1-feature-devsecops-56-2b77118-ba5032c-1
      helm:
        releaseName: global-certs
        valueFiles:
          - $values/apps/dev/global-certs.yaml
    - repoURL: https://github.com/raulstechtips/cluster-config.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: cert-manager
  revisionHistoryLimit: 10
