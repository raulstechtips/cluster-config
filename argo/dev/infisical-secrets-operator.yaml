# Infisical secrets operator and shared authentication from the GHCR wrapper chart.
# Manual sync keeps adoption deliberate; values come from apps/dev/infisical-secrets-operator.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infisical-secrets-operator
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-options: Delete=false
spec:
  project: platform
  sources:
    - repoURL: ghcr.io/raulstechtips/charts
      chart: infisical-secrets-operator
      # Set to the first CI build (1.0.1-main-<sha>-<run>) after the chart repo is merged.
      targetRevision: 1.0.1-feature-devsecops-187-270ca24-19e7505-1
      helm:
        releaseName: infisical-secrets-operator
        valueFiles:
          - $values/apps/dev/infisical-secrets-operator.yaml
    - repoURL: https://github.com/raulstechtips/cluster-config.git
      targetRevision: feature/DEVSECOPS-187-Move-minio-operator-infisical-gateway-infisical-secrets-operator-to-its-own-repo
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  revisionHistoryLimit: 10
