# Infisical, from the infisical wrapper chart in GHCR (public package).
# Manual sync on purpose: a sync is a deliberate restart of the vault.
# Values come from apps/dev/infisical.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infisical
  namespace: argocd
  annotations:
    # root-dev must never delete this Application.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  project: platform
  sources:
    - repoURL: ghcr.io/raulstechtips/charts
      chart: infisical
      # Placeholder; todo 11 replaces it with the published chart version.
      targetRevision: 0.0.0-pending-todo-11
      helm:
        releaseName: infisical
        valueFiles:
          - $values/apps/dev/infisical.yaml
    - repoURL: https://github.com/raulstechtips/cluster-config.git
      targetRevision: feature/DEVSECOPS-44-Move-Infisical-to-its-own-repo
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: infisical
  revisionHistoryLimit: 10
  # The chart stamps updatedAt on every render. Argo CD must not treat that as drift.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: infisical-infisical-standalone-infisical
      namespace: infisical
      jqPathExpressions:
        - .metadata.annotations.updatedAt
        - .spec.template.metadata.annotations.updatedAt
  # No automated sync: Infisical rolls only when someone syncs it on purpose.
  syncPolicy:
    syncOptions:
      - RespectIgnoreDifferences=true
      - CreateNamespace=true
