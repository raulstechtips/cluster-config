# Infisical from the public wrapper chart in GHCR.
# Manual sync keeps restarts deliberate; values come from apps/dev/infisical.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infisical
  namespace: argocd
  annotations:
    # root-dev must never delete this Application.
    argocd.argoproj.io/sync-options: Delete=false
spec:
  project: platform
  sources:
    - repoURL: ghcr.io/raulstechtips/charts
      chart: infisical
      targetRevision: 1.0.1-feature-devsecops-44-ee094a0-496688b-2
      helm:
        releaseName: infisical
        valueFiles:
          - $values/apps/dev/infisical.yaml
    - repoURL: https://github.com/raulstechtips/cluster-config.git
      targetRevision: feature/DEVSECOPS-44-Move-Infisical-to-its-own-repo
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: infisical
  revisionHistoryLimit: 10
  # The chart stamps updatedAt on every render. Argo CD must not treat that as drift.
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: infisical-infisical-standalone-infisical
      namespace: infisical
      jqPathExpressions:
        - .metadata.annotations.updatedAt
        - .spec.template.metadata.annotations.updatedAt
