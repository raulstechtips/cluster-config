# Bootstrap for the dev cluster. Apply once by hand:
#   kubectl apply -f bootstrap/dev.yaml
# This file is outside argo/dev/, so root-dev never manages itself.
# GHCR repository credentials come from the argocd chart (apps/dev/argocd.yaml,
# externalRegistrySecrets). The argocd chart package must stay public, so a new
# cluster can pull it before that Secret exists.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-dev
  namespace: argocd
  # No resources-finalizer: deleting root-dev must never delete child Applications.
spec:
  project: default
  source:
    repoURL: https://github.com/raulstechtips/cluster-config.git
    targetRevision: main
    path: argo/dev
    directory:
      recurse: false
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # Auto-sync with selfHeal. Prune stays off: deleting a file in argo/dev/
  # does not delete the Application. Remove it by hand after a check.
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
