# Pinned rollback Application for infisical (DEVSECOPS-44).
#
# valid only while the kustomize-envsubst CMP and Secret argocd-app-env exist;
# delete in the envsubst cleanup ticket.
#
# This re-renders the old kustomize app from apps/infisical at the pinned
# commit 938f896d1652dbdff4fdbff12affe9e065054a7b (it recreates
# infisical-secrets via envsubst from argocd-app-env ARGOCD_ENV_INFISICAL_*).
# It lives outside argo/dev so root-dev never applies it.
#
# Rollback tiers:
#   Tier 0 (first response, valid until infisical-secrets is deleted):
#     kubectl -n infisical rollout undo deployment/infisical-infisical-standalone-infisical
#   Tier 1 (before root-dev adopts the Application): kubectl replace -f this file
#     (never kubectl apply), assert .spec.sources == null and
#     .spec.source.targetRevision == the pinned SHA, then argocd app sync infisical.
#   Tier 2 (after root-dev adopts it): PR on cluster-config replacing
#     argo/dev/infisical.yaml with this file's contents; after merge and
#     root-dev shows the pinned SHA, argocd app sync infisical.
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infisical
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/raulstechtips/cluster-config.git
    targetRevision: 938f896d1652dbdff4fdbff12affe9e065054a7b
    path: apps/infisical
    plugin:
      name: kustomize-envsubst
  destination:
    server: https://kubernetes.default.svc
    namespace: infisical
  syncPolicy: {}
  revisionHistoryLimit: 10
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: infisical-infisical-standalone-infisical
      namespace: infisical
      jqPathExpressions:
        - .metadata.annotations.updatedAt
        - .spec.template.metadata.annotations.updatedAt
